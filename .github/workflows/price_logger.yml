name: Price Logger

on:
  schedule:
    - cron: '45 3 * * 1-5'   # 9:15 AM IST - market open
    - cron: '0 10 * * 1-5'   # 3:30 PM IST - market close
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: open or close'
        required: false
        default: 'open'

jobs:
  log-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install gspread google-auth yfinance
      - name: Determine mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt "6" ]; then
              echo "mode=open" >> $GITHUB_OUTPUT
            else
              echo "mode=close" >> $GITHUB_OUTPUT
            fi
          fi
      - name: Log prices
        env:
          GSPREAD_JSON: ${{ secrets.GSPREAD_JSON }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: python price_logger.py --mode $MODE
